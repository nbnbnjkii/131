name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Build debug APK
        run: |
          set +e
          ./gradlew :app:assembleDebug --no-daemon --stacktrace > build-output.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            { grep -B4 -A12 -E "error:|error :" build-output.log | head -250
              echo "=================== TAIL ==================="
              tail -40 build-output.log
            } > ci-error-tail.txt
            git config user.name "arena-ci"
            git config user.email "arena-ci@localhost"
            git add ci-error-tail.txt
            git commit -m "CI error tail [skip ci]"
            git push
          fi
          exit $code

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: realms-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to the branch
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/realms-debug.apk
          git config user.name "arena-ci"
          git config user.email "arena-ci@localhost"
          git add -f dist/realms-debug.apk
          git commit -m "APK build ${GITHUB_RUN_NUMBER} [skip ci]"
          git push
